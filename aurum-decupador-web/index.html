<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurum Decupador AI</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="hero"><div><div class="brand">AURUM <span>DECUPADOR AI</span></div><h1>Decupagem automática de vídeos longos.</h1><p>Envie um vídeo/áudio ou cole um link autorizado do YouTube. Receba os melhores trechos com início e fim exatos, organizados por assunto.</p></div><div class="badge">ONLINE</div></header><section class="panel"><div class="tabs"><button class="tab active" data-tab="file">Arquivo</button><button class="tab" data-tab="youtube">YouTube</button></div><div id="filePane" class="pane active"><label class="drop"><strong>Escolher vídeo ou áudio</strong><span>O vídeo/áudio é transcrito no navegador. Na primeira utilização, o modelo de voz é carregado automaticamente.</span><input id="fileInput" type="file" accept="video/*,audio/*"></label></div><div id="youtubePane" class="pane"><label>Link do YouTube<input id="youtubeUrl" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><label class="check"><input id="rights" type="checkbox"> Confirmo que tenho autorização para processar este conteúdo.</label></div><div class="settings"><label>Máximo de cortes<input id="maxCuts" type="number" min="5" max="40" value="20"></label><label>Duração mínima<input id="minSec" type="number" min="15" max="60" value="20"></label><label>Duração máxima<input id="maxSec" type="number" min="25" max="120" value="59"></label></div><button id="analyzeBtn" class="primary">ANALISAR</button><div id="status" class="status hidden"></div><div id="progressWrap" class="progressWrap hidden"><div id="progressBar"></div></div></section><section id="results" class="results hidden"><div class="summaryCard"><div class="eyebrow">RESUMO</div><p id="summary"></p></div><div class="subjectsBlock"><div class="eyebrow">ASSUNTOS</div><div id="subjects" class="chips"></div></div><div class="resultsHead"><div><div class="eyebrow">DECUPAGEM</div><h2 id="cutsTitle"></h2></div><button id="copyAll" class="secondary">COPIAR TUDO</button></div><div id="groups"></div><details class="transcript"><summary>Ver transcrição completa</summary><div id="transcriptText"></div></details></section></main><script type="module" src="app.js?v=20260928-4"></script></body></html>
